name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh dist

      - name: Verify release
        run: |
          dist/Caffeinator.app/Contents/MacOS/Caffeinator --self-test
          codesign --verify --deep --strict --verbose=2 dist/Caffeinator.app
          unzip -tq dist/Caffeinator-macOS.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Caffeinator-macOS.zip \
            --title "Caffeinator $GITHUB_REF_NAME" \
            --generate-notes
